<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{user/layout}">
<head>
    <title th:text="${user.id == null ? 'Add User' : 'Edit User'}"></title>
</head>
<body>
<main layout:fragment="content" class="container mt-4">
    <h2 th:text="${user.id == null ? 'Add User' : 'Edit User'}"></h2>

    <form th:action="@{/admin/users/saveOrUpdate}" th:object="${user}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" th:field="*{username}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" th:field="*{password}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Role</label>
            <select th:field="*{role}" class="form-control">
                <option value="USER">USER</option>
                <option value="ADMIN">ADMIN</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="@{/admin/users}" class="btn btn-secondary">Cancel</a>
    </form>
</main>
</body>
</html>
