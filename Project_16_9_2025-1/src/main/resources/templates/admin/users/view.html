<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{user/layout}">
<head>
    <title>View User</title>
</head>
<body>
<main layout:fragment="content" class="container mt-4">
    <h2>User Details</h2>
    <dl class="row">
        <dt class="col-sm-2">ID</dt>
        <dd class="col-sm-10" th:text="${user.id}"></dd>

        <dt class="col-sm-2">Username</dt>
        <dd class="col-sm-10" th:text="${user.username}"></dd>

        <dt class="col-sm-2">Email</dt>
        <dd class="col-sm-10" th:text="${user.email}"></dd>

        <dt class="col-sm-2">Role</dt>
        <dd class="col-sm-10" th:text="${user.role}"></dd>
    </dl>

    <a th:href="@{/admin/users}" class="btn btn-secondary">Back</a>
</main>
</body>
</html>
