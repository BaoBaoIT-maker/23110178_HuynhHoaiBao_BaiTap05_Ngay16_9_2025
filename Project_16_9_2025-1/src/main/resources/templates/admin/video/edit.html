<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<main layout:fragment="content">
    <h2 th:text="${video.id == null ? 'Thêm Video' : 'Chỉnh sửa Video'}"></h2>

    <form th:action="@{${video.id == null ? '/admin/video/add' : '/admin/video/edit'}}"
          th:object="${video}" method="post">

        <div class="mb-3">
            <label>Tiêu đề</label>
            <input type="text" th:field="*{title}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label>Mô tả</label>
            <textarea th:field="*{description}" class="form-control"></textarea>
        </div>

        <div class="mb-3">
            <label>URL</label>
            <input type="text" th:field="*{url}" class="form-control"/>
        </div>

        <div class="mb-3">
            <label>Danh mục</label>
            <select th:field="*{category}" class="form-select">
                <option th:each="c : ${categories}" th:value="${c}" th:text="${c.name}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label>Hoạt động</label>
            <input type="checkbox" th:field="*{active}"/>
        </div>

        <button type="submit" class="btn btn-success">Lưu</button>
        <a th:href="@{/admin/video}" class="btn btn-secondary">Hủy</a>
    </form>
</main>
</body>
</html>
