<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Danh sách Video</title>
</head>
<body>
<main layout:fragment="content">
    <div class="container mt-4">
        <h2 class="mb-3">Danh sách Video</h2>
        <a th:href="@{/admin/video/add}" class="btn btn-success mb-3">➕ Thêm Video</a>

        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Tiêu đề</th>
                    <th>Mô tả</th>
                    <th>Link</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="video : ${videos}">
                    <td th:text="${video.id}"></td>
                    <td th:text="${video.title}"></td>
                    <td th:text="${video.description}"></td>
                    <td>
			            <video width="320" height="240" controls>
			                <source th:src="${video.url}" type="video/mp4">
			            </video>
			        </td>
                    <td><a th:href="${video.url}" target="_blank">Xem</a></td>
                    <td>
                        <a th:href="@{|/admin/video/view/${video.id}|}" class="btn btn-info btn-sm">👁 Xem</a>
                        <a th:href="@{|/admin/video/edit/${video.id}|}" class="btn btn-warning btn-sm">✏ Sửa</a>
                        <a th:href="@{|/admin/video/delete/${video.id}|}" class="btn btn-danger btn-sm"
                           onclick="return confirm('Xóa video này?')">🗑 Xóa</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
