<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Thêm Video</title>
</head>
<body>
<main layout:fragment="content">
    <div class="container mt-4">
        <h2>Thêm Video</h2>
        <form th:action="@{/admin/video/save}" th:object="${video}" method="post" enctype="multipart/form-data">
    <div class="mb-3">
        <label>Tiêu đề</label>
        <input type="text" th:field="*{title}" class="form-control"/>
    </div>
    <div class="mb-3">
        <label>Mô tả</label>
        <textarea th:field="*{description}" class="form-control"></textarea>
    </div>
    <div class="mb-3">
        <label>File video (mp4)</label>
        <input type="file" name="file" class="form-control" accept="video/mp4"/>
    </div>
    <div class="mb-3">
        <label>Trạng thái</label>
        <input type="checkbox" th:field="*{active}"/> Hoạt động
    </div>
    <button type="submit" class="btn btn-primary">Lưu</button>
</form>

    </div>
</main>
</body>
</html>
